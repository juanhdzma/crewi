name: Build & push to GHCR

on:
  push:
    branches: [master]
    paths:
      - cmd/**
      - internal/**
      - web/**
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - web/**
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crewi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
